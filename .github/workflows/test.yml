name: Test

on: [push, pull_request]

jobs:
  build:
    name: build (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        django-version: ['5.2', 'main']
        exclude:
          - python-version: '3.10'
            django-version: 'main'
          - python-version: '3.11'
            django-version: 'main'
        include:
          - python-version: '3.13'
            django-version: '5.2'
          - python-version: '3.14'
            django-version: '5.2'
          - python-version: '3.13'
            django-version: 'main'
          - python-version: '3.14'
            django-version: 'main'
          - python-version: '3.12'
            django-version: '6.0'
          - python-version: '3.13'
            django-version: '6.0'
          - python-version: '3.14'
            django-version: '6.0'
          - python-version: '3.12'
            django-version: '6.1'
          - python-version: '3.13'
            django-version: '6.1'
          - python-version: '3.14'
            django-version: '6.1'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_USER: root
          MARIADB_ROOT_PASSWORD: mysql
          MARIADB_DATABASE: mysql
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 3306:3306

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Get pip cache dir
      id: pip-cache
      run: |
        echo "dir=$(pip cache dir)" >> "$GITHUB_OUTPUT"

    - name: Cache
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key:
          ${{ matrix.python-version }}-v1-${{ hashFiles('**/requirements.txt') }}-${{ hashFiles('**/setup.py') }}-${{ hashFiles('**/tox.ini') }}
        restore-keys: |
          ${{ matrix.python-version }}-v1-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade tox tox-gh-actions

    - name: Tox tests
      run: |
        tox -v
      env:
        DJANGO: ${{ matrix.django-version }}

    - name: Upload coverage
      uses: codecov/codecov-action@v7.0.0
      with:
        name: Python ${{ matrix.python-version }}

  tox_checks:
    name: Run tox environment ${{ matrix.tox-env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tox-env: ['quality', 'dist-validation']

    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade tox tox-gh-actions

    - name: Tox tests
      run: tox -e ${{ matrix.tox-env }} -v
