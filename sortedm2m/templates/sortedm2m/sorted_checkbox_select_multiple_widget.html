{% load i18n %}

<div class="sortedm2m-container">

    <p class="selector-filter">
        <span class="help-tooltip search-label-icon" aria-label="{% blocktranslate %}Type into this box to filter down the list of available {{ field_name }}.{% endblocktranslate %}"></span>
        <input type="text" placeholder="{% trans "Filter" %}" />
    </p>
    <ul class="sortedm2m-items">
    {% for row in selected %}
        <li class="sortedm2m-item"><label{{ row.label_for|safe }}>{{ row.rendered_cb }} {{ row.option_label }}</label></li>
    {% endfor %}

    {% for row in unselected %}
        <li class="sortedm2m-item"><label{{ row.label_for|safe }}>{{ row.rendered_cb }} {{ row.option_label }}</label></li>
    {% endfor %}
    </ul>

    <p class="help">
        {% trans "Choose items and order by drag & drop." %}
    </p>

</div>
