[tox]
envlist =
    {py310,py311,py312}-djangomain-{sqlite3,mysql,postgresql}
    {py310,py311,py312,py313,py314}-django52-{sqlite3,mysql,postgresql}
    {py312,py313,py314}-django{60,61}-{sqlite3,mysql,postgresql}
    quality
    dist-validation

[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314

[gh-actions:env]
DJANGO =
    5.2: django52
    6.0: django60
    6.1: django61
    main: djangomain

[testenv]
deps =
    coverage
    mysql: mysqlclient
    postgresql: psycopg2-binary
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    djangomain: https://github.com/django/django/archive/main.tar.gz
ignore_outcome =
    main: True
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/test_project
    DJANGO_SETTINGS_MODULE = settings
    sqlite3: DB_ENGINE=sqlite3
    sqlite3: DB_NAME=":memory:"
    mysql: DB_ENGINE=mysql
    mysql: DB_NAME=mysql
    mysql: DB_USER=root
    mysql: DB_PASSWORD=mysql
    mysql: DB_PORT=3306
    postgresql: DB_ENGINE=postgresql
    postgresql: DB_NAME=postgres
    postgresql: DB_PASSWORD=postgres
commands =
    coverage run {envbindir}/django-admin test --noinput {posargs:sortedm2m_tests}
    coverage report
    coverage xml

[testenv:quality]
deps =
    Django>=6.1,<6.2
    selenium<4.0
    psycopg2-binary
    -rrequirements.txt
allowlist_externals =
    make
commands =
    make quality

[testenv:dist-validation]
deps =
    setuptools
    twine>=3.1.1
commands =
    python setup.py sdist
    twine check dist/*

